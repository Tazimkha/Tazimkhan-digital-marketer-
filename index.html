<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tazim Khan Digital Marketer | Performance & Growth Expert</title>
  <meta name="description" content="Official portfolio of Tazim Khan Digital Marketer. Expert in Performance Marketing, Social Media Strategy, and AI-driven growth." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060608;
      --surface: #0d0d12;
      --surface2: #13131c;
      --accent: #ff5f1f;
      --accent2: #ff8c5a;
      --text: #e8e4dc;
      --muted: #6b6878;
      --border: rgba(255,255,255,0.06);
      --glow: rgba(255, 95, 31, 0.18);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      cursor: none;
    }

    /* CUSTOM CURSOR */
    .cursor {
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.15s ease;
      mix-blend-mode: normal;
    }
    .cursor-ring {
      width: 36px; height: 36px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none;
      z-index: 9998;
      transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.2s;
      opacity: 0.5;
    }
    body:hover .cursor-ring { opacity: 1; }

    /* NOISE OVERLAY */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9990; opacity: 0.4;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; width: 100%; z-index: 100;
      padding: 24px 48px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid transparent;
      transition: background 0.4s, border-color 0.4s, padding 0.4s;
    }
    nav.scrolled {
      background: rgba(6,6,8,0.92);
      backdrop-filter: blur(20px);
      border-color: var(--border);
      padding: 16px 48px;
    }
    .nav-logo {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-decoration: none;
      text-transform: uppercase;
    }
    .nav-links { display: flex; gap: 40px; list-style: none; }
    .nav-links a {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 48px;
      position: relative;
      overflow: hidden;
    }
    .hero-grid-line {
      position: absolute;
      background: var(--border);
    }
    .hero-grid-line.v1 { width: 1px; height: 100%; left: 33.33%; top: 0; }
    .hero-grid-line.v2 { width: 1px; height: 100%; left: 66.66%; top: 0; }
    .hero-grid-line.h1 { height: 1px; width: 100%; top: 50%; left: 0; }

    .hero-badge {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.8s 0.2s forwards;
      display: flex; align-items: center; gap: 12px;
    }
    .hero-badge::before {
      content: '';
      display: inline-block; width: 32px; height: 1px;
      background: var(--accent);
    }

    h1.hero-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(68px, 11vw, 160px);
      line-height: 0.9;
      letter-spacing: 0.01em;
      color: var(--text);
      opacity: 0;
      animation: fadeUp 0.9s 0.4s forwards;
      mix-blend-mode: normal;
    }
    h1.hero-name span {
      color: var(--accent);
      display: block;
    }

    .hero-sub {
      margin-top: 32px;
      font-size: 17px;
      color: var(--muted);
      max-width: 520px;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.9s 0.6s forwards;
    }

    .hero-cta {
      margin-top: 48px;
      display: flex; gap: 20px; align-items: center;
      opacity: 0;
      animation: fadeUp 0.9s 0.8s forwards;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--accent);
      color: #fff;
      padding: 14px 32px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }
    .btn-primary:hover { background: var(--accent2); transform: translateY(-2px); }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 10px;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 14px 32px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); transform: translateY(-2px); }

    .hero-scroll-indicator {
      position: absolute;
      bottom: 40px; left: 48px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      writing-mode: vertical-rl;
      display: flex; align-items: center; gap: 12px;
      opacity: 0; animation: fadeUp 1s 1.2s forwards;
    }
    .hero-scroll-indicator::after {
      content: '';
      width: 1px; height: 60px;
      background: linear-gradient(to bottom, var(--muted), transparent);
      animation: scrollLine 2s 1.5s infinite;
    }
    @keyframes scrollLine {
      0% { transform: scaleY(0); transform-origin: top; }
      50% { transform: scaleY(1); transform-origin: top; }
      51% { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    .hero-stats {
      position: absolute;
      right: 48px; bottom: 60px;
      display: flex; flex-direction: column; gap: 24px;
      opacity: 0; animation: fadeLeft 0.9s 1s forwards;
    }
    .stat-item { text-align: right; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      color: var(--text);
      line-height: 1;
    }
    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ORANGE GLOW */
    .hero-glow {
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,95,31,0.12) 0%, transparent 70%);
      top: 20%; right: 15%;
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    /* SECTIONS */
    section { padding: 120px 48px; }

    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .section-label::before {
      content: '';
      display: inline-block; width: 24px; height: 1px;
      background: var(--accent);
    }

    h2.section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(42px, 7vw, 96px);
      line-height: 0.95;
      color: var(--text);
      margin-bottom: 64px;
    }

    /* ABOUT */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }
    .about-text p {
      font-size: 17px;
      line-height: 1.85;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .about-text p strong { color: var(--text); font-weight: 500; }

    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }
    .skill-card {
      background: var(--surface);
      padding: 28px 24px;
      border: 1px solid var(--border);
      transition: background 0.3s, border-color 0.3s, transform 0.3s;
      position: relative;
      overflow: hidden;
    }
    .skill-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 0;
      background: var(--accent);
      transition: height 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .skill-card:hover { background: var(--surface2); border-color: rgba(255,95,31,0.2); transform: translateY(-3px); }
    .skill-card:hover::before { height: 100%; }
    .skill-icon {
      font-size: 22px;
      margin-bottom: 14px;
    }
    .skill-name {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 8px;
    }
    .skill-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* SERVICES TICKER */
    .ticker-wrap {
      overflow: hidden;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 18px 0;
      margin: 0 -48px;
      background: var(--surface);
    }
    .ticker {
      display: flex;
      gap: 0;
      animation: tickerMove 25s linear infinite;
      white-space: nowrap;
    }
    .ticker-item {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0 40px;
      display: flex; align-items: center; gap: 28px;
    }
    .ticker-item span { color: var(--accent); font-size: 14px; }
    @keyframes tickerMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* PROJECTS */
    .projects-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }
    .project-card {
      background: var(--surface);
      padding: 48px 40px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .project-card:first-child {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }
    .project-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,95,31,0.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .project-card:hover { transform: translateY(-4px); }
    .project-card:hover::after { opacity: 1; }

    .project-tag {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .project-tag::before {
      content: '◆';
      font-size: 7px;
    }
    h3.project-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      line-height: 1;
      color: var(--text);
      margin-bottom: 16px;
    }
    .project-desc {
      font-size: 15px;
      line-height: 1.75;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .project-tags {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .tag-pill {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
    }
    .project-visual {
      background: var(--bg);
      border: 1px solid var(--border);
      height: 220px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .project-visual-inner {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 100px;
      color: rgba(255,95,31,0.08);
      line-height: 1;
      user-select: none;
    }
    .project-visual-badge {
      position: absolute;
      top: 20px; right: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
    }

    /* PROCESS */
    .process-section { background: var(--surface); margin: 0 -48px; padding: 120px 48px; }
    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
    }
    .process-step {
      padding: 40px 32px;
      background: var(--bg);
      border: 1px solid var(--border);
      position: relative;
      transition: background 0.3s;
    }
    .process-step:hover { background: var(--surface2); }
    .step-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 80px;
      color: rgba(255,95,31,0.08);
      line-height: 1;
      margin-bottom: -12px;
      display: block;
    }
    .step-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .step-desc {
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
    }

    /* CONTACT */
    .contact-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }
    .contact-left h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 8vw, 100px);
      line-height: 0.92;
      color: var(--text);
      margin-bottom: 32px;
    }
    .contact-left h2 em {
      font-style: normal;
      color: var(--accent);
    }
    .contact-left p {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 40px;
    }
    .contact-links { display: flex; flex-direction: column; gap: 14px; }
    .contact-link {
      display: flex; align-items: center; gap: 16px;
      text-decoration: none;
      color: var(--muted);
      font-size: 15px;
      padding: 18px 24px;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: all 0.3s;
    }
    .contact-link:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(255,95,31,0.06);
      transform: translateX(6px);
    }
    .contact-link-icon { font-size: 20px; width: 24px; text-align: center; }
    .contact-link-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: auto;
    }

    .contact-form-area {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 48px;
    }
    .form-row { margin-bottom: 24px; }
    .form-row label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .form-row input, .form-row textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }
    .form-row input:focus, .form-row textarea:focus {
      border-color: var(--accent);
    }
    .form-row textarea { min-height: 120px; }
    .form-submit {
      width: 100%;
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 18px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }
    .form-submit:hover { background: var(--accent2); transform: translateY(-2px); }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-logo {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .footer-copy {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .footer-socials { display: flex; gap: 24px; }
    .footer-socials a {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-socials a:hover { color: var(--accent); }

    /* DIVIDER */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 -48px;
    }

    /* REVEAL ANIMATIONS */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeLeft {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* WHATSAPP FLOAT */
    .wa-float {
      position: fixed;
      bottom: 36px; right: 36px;
      z-index: 200;
      display: flex; align-items: center; gap: 12px;
      text-decoration: none;
    }
    .wa-btn {
      width: 56px; height: 56px;
      background: #25D366;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 24px rgba(37,211,102,0.3);
      transition: transform 0.3s;
    }
    .wa-float:hover .wa-btn { transform: scale(1.1); }
    .wa-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transform: translateX(10px);
      transition: all 0.3s;
    }
    .wa-float:hover .wa-label { opacity: 1; transform: translateX(0); }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      nav { padding: 20px 24px; }
      nav.scrolled { padding: 14px 24px; }
      .nav-links { gap: 24px; }
      section { padding: 80px 24px; }
      .hero { padding: 0 24px; }
      h1.hero-name { font-size: clamp(56px, 14vw, 100px); }
      .hero-stats { display: none; }
      .about-grid, .contact-inner { grid-template-columns: 1fr; gap: 48px; }
      .skills-grid { gri
